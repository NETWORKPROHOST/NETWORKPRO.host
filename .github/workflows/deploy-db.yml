yaml
name: Sync MySQL on VPS
on:
  push:
    branches: [ main ]
  path:
    - '**.sql'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute SQL on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/html/networkpro.host
            git pull origin main
            mysql -u your_mysql_user -p'${{ secrets.DB_PASSWORD }}' your_database_name < /home/user/Documents/NetworkPro/GitHub/authorization.sql
