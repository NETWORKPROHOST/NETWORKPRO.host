<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forget Password</title>
    <!-- Working jQuery CDN link -->
    <script src="/networkpro.host/JS/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            // 1. Handle Generate OTP form submission via AJAX
            $("#OTPFORM").on("submit", function(event) {
                event.preventDefault();

                var emailVal = $("#emailForgot").val().trim();
                $("#mailMessage").text("Sending OTP...").css("color", "blue");

                $.post("sendmail.php", {
                    action: "send_otp",
                    emailForgot: emailVal
                }, function(response) {
                    if (response.status === "success") {
                        $("#mailMessage").text(response.message).css("color", "green");
                    } else {
                        $("#mailMessage").text(response.message).css("color", "red");
                    }
                }, "json").fail(function() {
                    $("#mailMessage").text("Server error. Could not send OTP.").css("color", "red");
                });
            });

            /// 2. Handle Validate OTP button click via AJAX
            $("#OTPCheck").on("click", function(event) {
                event.preventDefault();

                var enteredOTP = $("#enterOTP").val().trim();
                var emailVal = $("#emailForgot").val().trim();
                var $checkBtn = $(this);

                if (!emailVal) {
                    $("#resultMessage").text("Please enter your e-mail above first.").css("color", "red");
                    return;
                }

                if (!enteredOTP) {
                    $("#resultMessage").text("Please enter the OTP.").css("color", "red");
                    return;
                }

                $checkBtn.prop("disabled", true);
                $("#resultMessage").text("Verifying...").css("color", "blue");

                $.post("sendmail.php", {
                    action: "verify_otp",
                    emailForgot: emailVal,
                    enterOTP: enteredOTP
                }, function(response) {
                    if (response.status === "success") {
                        $("#resultMessage").text(response.message).css("color", "green");
                        window.location.href = "secretpage.php";
                    } else {
                        $("#resultMessage").text(response.message).css("color", "red");
                    }
                }, "json").fail(function() {
                    $("#resultMessage").text("Server error. Could not verify OTP.").css("color", "red");
                });
            });
        });
    </script>
</head>
<body>

    <!-- Form 1: Sends the email via AJAX to sendmail.php -->
    <form id="OTPFORM" method="post" action="sendmail.php">
        <p>Enter your e-mail: <input type="email" id="emailForgot" name="emailForgot" required></p>
        <p><input type="submit" name="OTPF" value="Generate OTP"></p>
        <p id="mailMessage"></p>
    </form>

    <hr>

    <!-- Section 2: Validates the entered OTP via AJAX -->
    <div>
        <p>Enter OTP: <input type="text" inputmode="numeric" id="enterOTP" name="enterOTP" maxlength="6"></p>
        <p><input type="button" id="OTPCheck" name="OTPCheck" value="Validate OTP"></p>
        <p id="resultMessage"></p>
    </div>

</body>
</html>
