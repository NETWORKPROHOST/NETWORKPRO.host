<!DOCTYPE html>
<html>
<title>Manifestation</title>
<head>
<script>
function speakText() {
	for(i=0; i<7; i++) { function text() {
	const t1=document.getElementById('l1').textContent;
	const t2=document.getElementById('f1').value;
	const t3=document.getElementById('l2').textContent;
	const t4=document.getElementById('f2').value;
	const text = document.getElementById('textInput').value;
	
	return t1+t2+t3+t4+text;	
	}
	if(text() !=="") {
	//1. Create a new utterance object
	const utterance = new SpeechSynthesisUtterance(text());

	//2.(Optional) Customize settings
	utterance.rate = 1; // Speed (0.1 to 10)
	utterance.pitch = 1; //Tone (0 to 2)
	utterance.volume=1; // Volume (0 to 1)

	//3.Trigger the Voice
	window.speechSynthesis.speak(utterance);
}
}i--;
}
</script>
</head>
<body>
<link rel="stylesheet" href="Speak.css" type="text/css">
<h2>Mainfestation</h2>
<hr>
<div>
<label id="l1" for="username">My name is</label>
<input id="f1"/><br/>
</div>
<div>
<label id="l2" for="aim">I want to become</label>
<input id="f2"/><br/>
</div>
<div>
<label for="prayer">Enter your other prayers..(in first person)</label>
<textarea id="textInput" placeholder="Enter text here.." rows="30" cols="40"></textarea><br/>
</div>
<div class="submit">
<button onclick="speakText()">Cast Spell</button>
</div>
</body>
</html>
